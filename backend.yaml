AWSTemplateFormatVersion: '2010-09-09'
Description: A-New-Startup EKS - Backend services needed by the code - DDB/SNS/SQS

Parameters:
  Prefix:
    Type: String
    Default: a-new-startup-eks
    Description: "A Prefix to use on the resource names."

Resources:
  StartupSignupsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: 'PAY_PER_REQUEST'
      AttributeDefinitions:
        -
          AttributeName: email
          AttributeType: S
      KeySchema:
        - 
          AttributeName: email
          KeyType: HASH 
  
  NewSignupQueue: 
    Type: AWS::SQS::Queue
      
  NewSignupTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
      - Endpoint:
          Fn::GetAtt: [NewSignupQueue, Arn]
        Protocol: sqs

  AllowSNS2SQSPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      PolicyDocument:
        Id: PublicationPolicy
        Statement:
        - Action: ['sqs:SendMessage']
          Condition:
            ArnEquals:
              aws:SourceArn: {Ref: NewSignupTopic}
          Effect: Allow
          Principal: {AWS: '*'}
          Resource:
            Fn::GetAtt: [NewSignupQueue, Arn]
          Sid: Allow-SNS-SendMessage
        Version: '2012-10-17'
      Queues:
      - {Ref: NewSignupQueue}
      
  AppManagedPolicy:
      Type: AWS::IAM::ManagedPolicy
      Description: Basic application level permissions needed for a-new-startup to run.
      Properties:
        # No PolicyName used, we want a unique name generated automatically
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - 'dynamodb:PutItem'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":dynamodb:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :table/a-new-startup*
            - Effect: Allow
              Action:
                - 'ssm:GetParameter*'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":ssm:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :parameter/a-new-startup*
            - Effect: Allow
              Action:
                - 'sns:Publish'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":sns:"
                      - Ref: AWS::Region
                      - ":"
                      - Ref: AWS::AccountId
                      - :a-new-startup*
            # The ec2 instance will need to be able to download the bundle (CodeDeploy)
            # This requires the build to be in a bucket that starts with a-new-startup*
            - Effect: Allow
              Action:
                - 's3:Get*'
                - 's3:List*'
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":s3"
                      - ":"
                      - ":"
                      - ":a-new-startup*"
                - Fn::Join:
                    - ""
                    - - "arn:"
                      - Ref: AWS::Partition
                      - ":s3"
                      - ":"
                      - ":"
                      - ":a-new-startup*/*"

Outputs:

  AppManagedPolicy:
    Value: !Ref AppManagedPolicy
    Export:
      Name: !Join ['-', [!Ref Prefix, 'AppManagedPolicy']]  

  TableName:
    Value: !Ref StartupSignupsTable
    Export:
      Name: !Join ['-', [!Ref Prefix, 'TableName']]
      
  TopicArn:
    Value: !Ref NewSignupTopic
    Export:
      Name: !Join ['-', [!Ref Prefix, 'TopicArn']]

  QueueArn:
    Value: !GetAtt NewSignupQueue.Arn
    Export:
      Name: !Join ['-', [!Ref Prefix, 'QueueArn']]
